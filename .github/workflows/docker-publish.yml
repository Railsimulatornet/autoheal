name: Docker Image

on:
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'autoheal.sh', 'healthcheck.sh', 'VERSION', '.github/**', 'README*.md', 'DOCKERHUB_README.md', 'examples/**']
  push:
    branches: [main]
    tags: ['v*']
    paths: ['Dockerfile', '.dockerignore', 'autoheal.sh', 'healthcheck.sh', 'VERSION', '.github/**']
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoheal-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_version: ${{ steps.meta.outputs.build_version }}
      release: ${{ steps.meta.outputs.release }}
      publish: ${{ steps.meta.outputs.publish }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release metadata and tag policy
        shell: bash
        run: bash .github/scripts/check-tag-policy.sh
      - name: Read release and build metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release_metadata.py

  security:
    needs: metadata
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
      security-events: write
    with:
      build_version: ${{ needs.metadata.outputs.build_version }}

  publish:
    needs: [metadata, security]
    if: ${{ needs.metadata.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: autoheal-registry-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: autoheal-verified-image
          path: ${{ runner.temp }}/autoheal-image
      - name: Install registry copy tool on GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Publish the verified image to both registries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -Eeuo pipefail
          (cd "$RUNNER_TEMP/autoheal-image" && sha256sum --check image.sha256)
          bash .github/scripts/publish-image.sh "$RUNNER_TEMP/autoheal-image/image.tar" "$IMAGE_TAG"

  release:
    needs: [metadata, publish]
    if: ${{ needs.metadata.outputs.release == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
