name: Tag Policy Check

on:
  pull_request:
    paths: ['VERSION', 'README*.md', 'DOCKERHUB_README.md', 'examples/**', '.github/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify latest and fixed tag policy
        shell: bash
        run: bash .github/scripts/check-tag-policy.sh
