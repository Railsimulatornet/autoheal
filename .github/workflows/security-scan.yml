name: Security Scan

on:
  workflow_call:
    inputs:
      build_version:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install validation tools on GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck skopeo
      - name: Validate source and pipeline tests
        shell: bash
        run: |
          set -Eeuo pipefail
          shellcheck autoheal.sh healthcheck.sh .github/scripts/*.sh
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select build version
        id: build
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.build_version }}
        run: |
          set -Eeuo pipefail
          version="${REQUESTED_VERSION:-$(tr -d '\r\n' < VERSION)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-build\.[0-9]{8}\.[0-9]+\.[0-9]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/autoheal-image"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build AMD64 and ARM64 once
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: false
          tags: autoheal:ci
          build-args: VERSION=${{ steps.build.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/autoheal-image/image.tar
          provenance: mode=max
          sbom: true
      - name: Verify and load both architecture candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/autoheal-image/image.tar"
          skopeo copy --all --preserve-digests "oci-archive:$archive" "oci:$RUNNER_TEMP/autoheal-layout"
          skopeo inspect --raw "oci-archive:$archive" > "$RUNNER_TEMP/archive.json"
          skopeo inspect --raw "oci:$RUNNER_TEMP/autoheal-layout" > "$RUNNER_TEMP/layout.json"
          cmp "$RUNNER_TEMP/archive.json" "$RUNNER_TEMP/layout.json"
          for arch in amd64 arm64; do
            skopeo --override-os linux --override-arch "$arch" copy \
              "oci-archive:$archive" "docker-daemon:autoheal:ci-$arch"
          done
      - name: Exercise runtime safeguards on both architectures
        shell: bash
        run: |
          set -Eeuo pipefail
          for arch in amd64 arm64; do
            python3 .github/scripts/smoke_runtime.py --image "autoheal:ci-$arch" --platform "linux/$arch"
          done
      - name: Scan both architectures and enforce security gate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull ghcr.io/aquasecurity/trivy:latest
          TRIVY_IMAGE="$(docker image inspect ghcr.io/aquasecurity/trivy:latest --format '{{.Id}}')"
          [[ "$TRIVY_IMAGE" =~ ^sha256:[a-f0-9]{64}$ ]]
          export TRIVY_IMAGE
          failed=0
          for arch in amd64 arm64; do
            if ! bash .github/scripts/scan-image.sh "$RUNNER_TEMP/autoheal-layout" "linux/$arch" "$PWD/trivy-results/$arch"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Check multi-platform registry round trip
        shell: bash
        run: bash .github/scripts/test-image-transfer.sh "$RUNNER_TEMP/autoheal-image/image.tar"
      - name: Upload AMD64 code scanning results
        if: ${{ always() && hashFiles('trivy-results/amd64/trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy-results/amd64/trivy.sarif
          category: autoheal-amd64
      - name: Upload ARM64 code scanning results
        if: ${{ always() && hashFiles('trivy-results/arm64/trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy-results/arm64/trivy.sarif
          category: autoheal-arm64
      - name: Save complete scan reports
        if: ${{ always() && hashFiles('trivy-results/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: autoheal-trivy-results
          path: trivy-results/
          retention-days: 30
      - name: Checksum verified image
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/autoheal-image"
          sha256sum image.tar > image.sha256
      - name: Save verified image
        uses: actions/upload-artifact@v7
        with:
          name: autoheal-verified-image
          path: ${{ runner.temp }}/autoheal-image/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
