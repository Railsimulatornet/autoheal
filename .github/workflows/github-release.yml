name: GitHub Release

# Called only after the verified image was published to BOTH registries.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.repository == 'Railsimulatornet/autoheal' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create release without changing published notes or old tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(tr -d '\r\n' < VERSION)" == "$RELEASE_VERSION" ]]
          tag="v$RELEASE_VERSION"
          grep -Fq "Autoheal v$RELEASE_VERSION" .github/release-notes.md
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.error"; then
            echo "Release $tag already exists; leaving it unchanged."
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/release.error" || { cat "$RUNNER_TEMP/release.error" >&2; exit 1; }
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "$(cat .github/release-title.txt)" \
              --notes-file .github/release-notes.md --latest
          fi
